<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gatewayBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <pattern id="gridDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.35"/>
    </pattern>

    <marker id="arrowB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowR" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#f87171"/>
    </marker>
    <marker id="arrowP" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#gridDots)"/>
  <rect width="100%" height="100%" fill="url(#centerGlow)"/>

  <!-- Connecting Lines -->
  <!-- Client -> Gateway -->
  <path d="M 96 100 L 148 100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowB)"/>

  <!-- Gateway -> Redis (Top branch) -->
  <path d="M 264 85 C 286 85, 292 56, 312 56" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrowR)"/>

  <!-- Gateway -> Kafka (Bottom branch) -->
  <path d="M 264 115 C 286 115, 292 144, 312 144" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrowP)"/>

  <!-- Node 1: Client -->
  <g transform="translate(24, 72)">
    <rect width="72" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <!-- Screen Icon -->
    <rect x="26" y="10" width="20" height="13" rx="2" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
    <line x1="32" y1="23" x2="40" y2="23" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="36" y="36" fill="#f1f5f9" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Client</text>
    <text x="36" y="47" fill="#64748b" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">HTTP / gRPC</text>
  </g>

  <!-- Node 2: API Gateway + Rate Limiter -->
  <g transform="translate(150, 56)">
    <rect width="114" height="88" rx="10" fill="#0c1322" stroke="url(#gatewayBorder)" stroke-width="1.8"/>
    <rect x="8" y="8" width="98" height="18" rx="4" fill="#1e293b" fill-opacity="0.8"/>
    <text x="57" y="21" fill="#93c5fd" font-size="9" font-weight="700" letter-spacing="0.5" text-anchor="middle" font-family="system-ui, sans-serif">API GATEWAY</text>
    <text x="57" y="47" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Rate Limiter</text>
    <!-- Token Bucket Badge -->
    <rect x="14" y="58" width="86" height="18" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="0.8"/>
    <text x="57" y="70" fill="#60a5fa" font-size="8.5" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">⚡ Token Bucket</text>
  </g>

  <!-- Node 3: Redis (State Sharing) -->
  <g transform="translate(314, 32)">
    <rect width="70" height="48" rx="8" fill="#180b0e" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="58" cy="12" r="3" fill="#22c55e"/>
    <text x="32" y="22" fill="#fca5a5" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Redis</text>
    <text x="32" y="36" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">State Sharing</text>
  </g>

  <!-- Node 4: Kafka (Event Streaming) -->
  <g transform="translate(314, 120)">
    <rect width="70" height="48" rx="8" fill="#150d22" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="58" cy="12" r="3" fill="#a855f7"/>
    <text x="32" y="22" fill="#d8b4fe" font-size="10.5" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Kafka</text>
    <text x="32" y="36" fill="#94a3b8" font-size="8" text-anchor="middle" font-family="system-ui, sans-serif">Event Stream</text>
  </g>

  <!-- Load test tag -->
  <g transform="translate(24, 168)">
    <rect width="112" height="16" rx="4" fill="#020617" stroke="#334155" stroke-width="0.8"/>
    <circle cx="10" cy="8" r="2.5" fill="#10b981"/>
    <text x="63" y="11.5" fill="#34d399" font-size="8" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">2,000+ RPS TESTED</text>
  </g>
</svg>
