<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="raftBgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <radialGradient id="raftCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="leaderBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="nodeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <pattern id="raftGridDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#334155" opacity="0.4"/>
    </pattern>

    <marker id="raftArrowCyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#38bdf8"/>
    </marker>
    <marker id="raftArrowAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,1 L5,3 L0,5 Z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#raftBgGrad)"/>
  <rect width="100%" height="100%" fill="url(#raftGridDots)"/>
  <rect width="100%" height="100%" fill="url(#raftCenterGlow)"/>

  <!-- Communication Channels / RPC Links -->
  <!-- Leader to Follower 1 (Bottom Left) -->
  <path d="M 160 85 C 130 95, 105 105, 80 120" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 2" fill="none" marker-end="url(#raftArrowAmber)"/>

  <!-- Leader to Follower 2 (Bottom Right) -->
  <path d="M 240 85 C 270 95, 295 105, 320 120" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3 2" fill="none" marker-end="url(#raftArrowAmber)"/>

  <!-- Inter-node consensus sync between Followers -->
  <path d="M 125 150 L 275 150" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Node 1: LEADER (Top Center) -->
  <g transform="translate(145, 18)">
    <rect width="110" height="74" rx="9" fill="#0b1329" stroke="url(#leaderBorder)" stroke-width="2"/>
    <!-- Crown / Star Badge for Leader -->
    <rect x="8" y="7" width="94" height="16" rx="3.5" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="55" y="19" fill="#fbbf24" font-size="8.5" font-weight="700" letter-spacing="0.6" text-anchor="middle" font-family="system-ui, sans-serif">★ RAFT LEADER</text>
    <text x="55" y="42" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Node A (Term 2)</text>
    <!-- WAL Indicator -->
    <rect x="12" y="52" width="86" height="15" rx="3" fill="#1e293b" stroke="#334155" stroke-width="0.7"/>
    <text x="55" y="63" fill="#38bdf8" font-size="8" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">💾 WAL • AppendEntries</text>
  </g>

  <!-- Node 2: FOLLOWER 1 (Bottom Left) -->
  <g transform="translate(30, 115)">
    <rect width="96" height="66" rx="8" fill="#0c1222" stroke="url(#nodeBorder)" stroke-width="1.3"/>
    <rect x="7" y="6" width="82" height="14" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
    <text x="48" y="16.5" fill="#93c5fd" font-size="8" font-weight="600" letter-spacing="0.5" text-anchor="middle" font-family="system-ui, sans-serif">FOLLOWER</text>
    <text x="48" y="38" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Node B</text>
    <rect x="8" y="46" width="80" height="13" rx="2.5" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="48" y="55.5" fill="#94a3b8" font-size="7.5" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">Log Synchronized</text>
  </g>

  <!-- Node 3: FOLLOWER 2 (Bottom Right) -->
  <g transform="translate(274, 115)">
    <rect width="96" height="66" rx="8" fill="#0c1222" stroke="url(#nodeBorder)" stroke-width="1.3"/>
    <rect x="7" y="6" width="82" height="14" rx="3" fill="#3b82f6" fill-opacity="0.12"/>
    <text x="48" y="16.5" fill="#93c5fd" font-size="8" font-weight="600" letter-spacing="0.5" text-anchor="middle" font-family="system-ui, sans-serif">FOLLOWER</text>
    <text x="48" y="38" fill="#e2e8f0" font-size="11" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">Node C</text>
    <rect x="8" y="46" width="80" height="13" rx="2.5" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="48" y="55.5" fill="#94a3b8" font-size="7.5" font-weight="500" text-anchor="middle" font-family="system-ui, sans-serif">Heartbeat OK: 50ms</text>
  </g>

  <!-- Cluster Quorum & Heartbeat Label Center -->
  <g transform="translate(142, 118)">
    <rect width="116" height="24" rx="5" fill="#020617" stroke="#3b82f6" stroke-width="0.9"/>
    <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
    <text x="64" y="15.5" fill="#a7f3d0" font-size="8" font-weight="700" letter-spacing="0.4" text-anchor="middle" font-family="system-ui, sans-serif">QUORUM: 2/3 MAJORITY</text>
  </g>

  <!-- Failover badge -->
  <g transform="translate(138, 155)">
    <rect width="124" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
    <text x="62" y="12.5" fill="#38bdf8" font-size="7.5" font-weight="600" text-anchor="middle" font-family="system-ui, sans-serif">⚡ LIVE LEADER FAILOVER</text>
  </g>
</svg>
